[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "board-game-companion"
version = "0.1.0"
description = "Local-first tabletop companion core for Arkham Horror LCG"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
pdf = ["pymupdf>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.hatch.build.targets.wheel]
packages = ["src/board_game_companion"]
